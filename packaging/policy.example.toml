# /etc/monarchy-identity/policy.toml: what "compliant" means for your fleet.
# `monarchy-identity check` evaluates this against `status --json` and exits 1 on any violation,
# so an MDM / osquery / cron job can use it as a compliance script. Only rules listed here are checked.
# Unknown keys are an error: a typo must never silently weaken a policy.

require_enrolled        = true
require_self_heal       = true
require_disk_encryption = true
require_firewall        = true
# require_secure_boot   = true
# require_tpm2          = true
require_time_sync       = true          # Kerberos sign-in fails when the clock is off by more than ~5 minutes
forbid_autologin        = true
required_login_mode     = groups
allowed_wheel_members   = root          # anyone else in the wheel group fails
max_screen_lock_seconds = 600           # user-level setting; "unknown" fails (proof required)
# unknown_is_failure    = false         # set to skip (instead of fail) values that cannot be determined
