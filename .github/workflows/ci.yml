name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.mailmap']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.mailmap']
  workflow_call:        # also run by release.yml before a release is cut

permissions:
  contents: read

# a newer push to the same branch/PR supersedes the run in flight
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck (python3 and node are preinstalled)
        run: sudo apt-get install -y --no-install-recommends shellcheck
      - name: Shellcheck (errors only)
        # every shell script by its #! line, so a new provider script or stub is linted without listing it here
        run: shellcheck -S error -s bash $(git ls-files '*.sh') $(git grep -lE '^#!/bin/(ba)?sh' -- ':!*.sh' ':!*.patch' ':!*.md')
      - name: Python syntax
        run: python3 -m py_compile $(git grep -lE '^#!.*python' -- ':!*.md' ':!*.patch')
      - name: Allow user namespaces (the unit tests run the CLI as fake root with unshare -r)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit tests (the real CLI against a temp /etc with stub commands)
        run: bash test/unit/run.sh

  package:
    name: Build the Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 10
    steps:
      - name: Install git
        run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          su builder -c 'packaging/build-local.sh --nodeps --noconfirm'
      - name: Check package contents
        run: |
          for p in packaging/monarchy-identity-*.pkg.tar.*; do echo "== $p"; bsdtar -tf "$p" | grep -v '/$'; done
          bsdtar -tf packaging/monarchy-identity-0*.pkg.tar.* | grep -q usr/bin/monarchy-identity
          bsdtar -tf packaging/monarchy-identity-0*.pkg.tar.* | grep -q usr/share/doc/monarchy-identity/index.md
          bsdtar -tf packaging/monarchy-identity-0*.pkg.tar.* | grep -q usr/share/doc/monarchy-identity/img/policy.png
      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packaging/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
