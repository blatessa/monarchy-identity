site_name: monarchy-identity
site_description: Directory sign-in for Omarchy
site_url: https://docs.monarchy.run/monarchy-identity/
repo_url: https://github.com/blatessa/monarchy-identity
repo_name: blatessa/monarchy-identity
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Understand:
      - How sign-in works: concepts/how-it-works.md
      - Who may sign in: concepts/login-policy.md
  - Guides:
      - Roll out to a fleet: guides/rollout.md
      - Automate enrollment: guides/automation.md
      - Manage enrolled laptops: guides/manage.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
      - Status output: reference/status-output.md
  - Active Directory: providers/ad.md
  - Microsoft Entra ID: providers/entra.md
  - Status and limits: status.md
  - Development:
      - Architecture: dev/architecture.md
      - Writing a provider: dev/writing-a-provider.md
      - Testing: dev/testing.md
      - Findings: dev/findings.md
      - Test evidence: dev/evidence.md
