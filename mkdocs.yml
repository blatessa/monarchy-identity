site_name: monarchy-identity
site_description: Directory sign-in, login policy and posture reporting for Omarchy
site_url: https://blatessa.github.io/monarchy-identity/
repo_url: https://github.com/blatessa/monarchy-identity
repo_name: blatessa/monarchy-identity
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Understand:
      - How sign-in works on Omarchy: concepts/how-it-works.md
      - Who may sign in: concepts/login-policy.md
      - Staying safe: concepts/safety-model.md
      - Staying correct: concepts/self-healing.md
  - Roll out:
      - Roll out to a fleet: guides/rollout.md
      - Getting started (one laptop): getting-started.md
      - Enroll safely: guides/enroll-safely.md
      - Automate enrollment: guides/automation.md
  - Operate:
      - Change who may sign in: guides/change-policy.md
      - Compliance checks: guides/compliance-checks.md
      - Omarchy integration: guides/omarchy-integration.md
      - Leave and uninstall: guides/leave-and-uninstall.md
      - Troubleshooting: guides/troubleshooting.md
  - Reference:
      - CLI: reference/cli.md
      - Posture report: reference/posture.md
      - Compliance policy file: reference/policy-file.md
      - Configuration file: reference/config-file.md
      - Files, units and variables: reference/files.md
      - What enroll does, step by step: reference/enrollment-steps.md
  - Providers:
      - Overview: providers/index.md
      - sssd (Active Directory): providers/sssd.md
      - Writing a provider: providers/writing-a-provider.md
  - Status and limits: status.md
  - Test evidence: evidence.md
  - Development:
      - Architecture: dev/architecture.md
      - Testing: dev/testing.md
      - Findings: dev/findings.md
