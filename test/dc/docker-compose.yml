# Throwaway Samba AD DC for testing. Loopback only; never expose.
services:
  dc:
    image: nowsci/samba-domain:latest
    container_name: oi-test-dc
    hostname: dc
    privileged: true
    environment:
      DOMAIN: CORP.TEST
      DOMAINPASS: "Passw0rd!Test"
      DNSFORWARDER: "NONE"
      HOSTNAME: dc
      NOCOMPLEXITY: "true"
      INSECURELDAP: "true"
    volumes:
      - oi-dc-data:/var/lib/samba
      - oi-dc-etc:/etc/samba/external
    ports:
      - "127.0.0.1:88:88"
      - "127.0.0.1:88:88/udp"
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
      - "127.0.0.1:445:445"
      - "127.0.0.1:464:464"
      - "127.0.0.1:464:464/udp"
      - "127.0.0.1:3268:3268"
volumes:
  oi-dc-data:
  oi-dc-etc:
