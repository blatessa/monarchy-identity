# The PAM module that signs Entra users in, and its arguments per stack. The core inserts it with lib/pamedit.py.
# himmelblau makes home directories itself (/home/<object id> and a /home/<sign-in name> link), and Entra passwords
# are changed in Entra, so neither of the core's two extras applies.
module = "pam_himmelblau.so"
auth = "ignore_unknown_user set_authtok"
account = "ignore_unknown_user"
password = "ignore_unknown_user"
mkhomedir = "false"
expired_password_screen = "false"
# The first sign-in after the network drops aborts; asked again, it answers from the offline cache.
auth_retry_on_abort = "true"
# Entra can ask for an authenticator code after the password, which SDDM can't: the login screen asks Entra once and
# the second step comes on a screen before the desktop. (Expired Entra passwords are changed in Entra.)
second_step_screen = "true"
