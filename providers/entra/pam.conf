# The PAM module that signs Entra users in, and its arguments per stack. The core inserts it with lib/pamedit.py.
# himmelblau makes home directories itself (/home/<object id> and a /home/<sign-in name> link), and asks for a new
# password itself, during sign-in, when Entra says it must be changed, so neither of the core's two extras applies.
module = "pam_himmelblau.so"
auth = "ignore_unknown_user set_authtok"
account = "ignore_unknown_user"
password = "ignore_unknown_user"
mkhomedir = "false"
expired_password_screen = "false"
# The first sign-in after the network drops aborts; asked again, it answers from the offline cache.
auth_retry_on_abort = "true"
# Entra can ask for an authenticator code after the password, or wait for a number to be approved on the phone, which
# SDDM can't carry: the login screen asks through lib/login-steps. So does its new password, when one is wanted.
login_steps = "true"
